<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>実施用一覧</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172641;font:16px/1.5 'Yu Gothic',Meiryo,sans-serif}
header{background:#142b50;color:white;padding:14px 24px}.header-inner,main{max-width:1440px;margin:auto}.header-inner{display:flex;justify-content:space-between;align-items:center;gap:20px}.exam-title{font-size:14px;color:#dce6f6}h1{font-size:24px;margin:4px 0 0}.header-right{text-align:right;flex-shrink:0}.brand-label{font-size:12px;font-weight:700;margin-bottom:8px}nav{display:flex;gap:8px;justify-content:flex-end}nav a{color:white;border:1px solid #7890b4;border-radius:8px;padding:8px 16px;text-decoration:none;font-weight:700}
main{padding:14px 24px 16px}.controls{display:flex;align-items:center;gap:16px;background:white;border:1px solid #d9e1ed;border-radius:12px;padding:10px 16px}.label{font-weight:700;color:#55647b;flex-shrink:0}.buttons{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;font-weight:700;min-height:44px;padding:8px 22px;border:1px solid #b4c4dd;border-radius:8px;background:white;color:#172641;cursor:pointer}button[aria-pressed=true]{background:#1e4fc2;border-color:#1e4fc2;color:white}button:disabled{cursor:wait;opacity:.55}button:focus-visible,a:focus-visible{outline:3px solid #eaa329;outline-offset:3px}#refresh{font-size:14px;padding:8px 14px;margin-left:auto;flex-shrink:0}
.toolbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:10px 0}h2{font-size:20px;margin:0}#status{margin:0;color:#5a6b82;font-size:13px}#status.error{color:#a44121}
.grades-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;height:var(--list-height,calc(100dvh - 220px));min-height:160px}.grade-panel{min-width:0;min-height:0;display:flex;flex-direction:column;background:white;border:1px solid #d9e1ed;border-radius:12px;overflow:hidden}.grade-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:#eaf0fa;border-bottom:1px solid #d9e1ed}.grade-heading h3{margin:0;color:#234786;font-size:20px}.count{color:#5a6b82;font-size:12px}.grade-content{min-height:0;flex:1;overflow:auto;font-size:var(--row-font,20px)}.common{font-size:.8em;background:#fff5df;color:#80510a;padding:.5em .7em;margin:0;border-bottom:1px solid #ebd7ac}
table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{text-align:left;padding:.3em .5em;border-bottom:1px solid #dfe6f0;vertical-align:middle}thead{color:#5a6b82;background:#f6f8fc;font-size:.7em}thead th:first-child{width:46%}tbody th{font-weight:700;overflow-wrap:anywhere;line-height:1.35}tbody tr:last-child>*{border-bottom:0}.codes{display:flex;align-items:center;gap:.3em;flex-wrap:wrap}.code{display:inline-flex;align-items:center;justify-content:center;min-width:1.45em;height:1.5em;padding:0 .25em;border-radius:6px;background:#eaf0fa;color:#1e4fc2;font-size:1.35em;line-height:1;font-weight:800}.alternate{font-size:.8em;font-weight:700;border-radius:5px;background:#fff0d2;color:#80510a;padding:.35em .45em}.alternate-text{white-space:pre-wrap;overflow-wrap:anywhere;margin:.3em 0 0;font-size:.8em;line-height:1.4}.pending{color:#77859b;font-size:.85em}.invalid{color:#a44121;font-size:.85em}.empty{padding:16px;color:#5a6b82;font-size:14px}[hidden]{display:none!important}
.compact th,.compact td{padding:.12em .45em}.compact .code{font-size:1.15em;height:1.25em;min-width:1.3em}.compact .alternate{padding:.15em .4em}.compact .alternate-text{margin-top:.1em}
@media(max-width:1050px){header{padding:12px 16px}main{padding:12px 16px 16px}.grades-grid{gap:10px}.grade-heading{padding:8px 10px}.grade-heading h3{font-size:18px}}
@media(max-width:700px){header{padding:10px 12px}.header-inner{align-items:flex-start;gap:8px}h1{font-size:17px}.exam-title{font-size:10px}.brand-label{font-size:9px;margin-bottom:6px}nav{gap:4px}nav a{font-size:11px;padding:7px 8px}main{padding:10px 8px 16px}.controls{padding:8px;gap:6px;flex-wrap:wrap}.buttons{gap:4px}button{padding:7px 10px;font-size:14px}.label{font-size:13px}#refresh{font-size:12px;padding:7px 8px}.toolbar{gap:6px;flex-wrap:wrap}h2{font-size:17px}#status{font-size:11px}.grades-grid{gap:5px}.grade-heading{display:block;padding:6px}.grade-heading h3{font-size:16px}.count{font-size:10px}thead th:first-child{width:47%}th,td{padding:.3em}.empty{padding:8px;font-size:12px}}
</style>
</head>
<body>
<header><div class="header-inner"><div><div id="exam-title" class="exam-title"></div><h1 id="page-title">実施用一覧</h1></div><div class="header-right"><div class="brand-label">実力判定テスト範囲確定APP</div><nav aria-label="画面の切り替え"><a href="campuses.html">校舎一覧</a><a id="back" href="campuses.html">中学校別へ</a></nav></div></div></header>
<main>
<div class="controls"><span class="label">教科</span><div id="subjects" class="buttons" role="group" aria-label="教科"></div><button id="refresh" disabled>最新に更新</button></div>
<div class="toolbar"><h2 id="list-title">選択単元一覧</h2><p id="status" role="status" aria-live="polite">読み込み中…</p></div>
<div id="grades" class="grades-grid" aria-labelledby="list-title"></div>
</main>
<script src="config.js"></script><script src="cloud-api.js"></script><script src="execution-data.js"></script><script src="execution.js?v=20260924"></script>
</body></html>
