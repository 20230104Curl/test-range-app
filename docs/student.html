<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生徒用｜テスト範囲</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172641;font:16px/1.5 'Yu Gothic',Meiryo,sans-serif}header{background:#142b50;color:white;padding:16px 24px}.heading{max-width:1200px;margin:auto;display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:1.5rem;margin:0}.brand{font-size:12px;text-align:right}#exam-title{font-size:.9rem;margin:5px 0 0;color:#dce6f6}main{max-width:1440px;margin:auto;padding:16px 24px}button{font:inherit;cursor:pointer;min-height:44px;border:1px solid #bdcbe0;background:white;color:#214888;border-radius:9px;padding:8px 18px;font-weight:bold}button[aria-pressed=true]{background:#1e4fc2;color:white;border-color:#1e4fc2}button:focus-visible{outline:3px solid #eaa329;outline-offset:3px}button:disabled{opacity:.6;cursor:wait}.views{display:grid;grid-template-columns:1fr 1fr;gap:12px}.views button{text-align:left;padding:12px 18px;font-size:1.1rem}.views small{display:block;font-size:.8rem;font-weight:normal;margin-top:4px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0}.grades,.schools{display:flex;gap:8px;flex-wrap:wrap}.schools{margin:8px 0 14px}.hint{font-size:.875rem;color:#56657d;margin:8px 0}#status{font-size:.875rem;color:#80510a;margin:8px 0}#status:empty{display:none}h2{font-size:1.15rem;margin:10px 0}h3{font-size:1rem;margin:0;padding:9px 12px;background:#eaf0fa;color:#214888}.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.column{display:grid;gap:12px}.subject{background:white;border:1px solid #d9e1ed;border-radius:10px;overflow:hidden;min-width:0}.unit{padding:8px 12px;border-bottom:1px solid #e5eaf2;overflow-wrap:anywhere}.unit:last-child{border:0}.pages{display:block;color:#56657d;font-size:.8em;margin-top:3px}.alternate{white-space:pre-wrap}.pending{color:#64748b;padding:12px;margin:0}.catalog{display:grid;grid-template-columns:1fr 1.15fr 1.45fr 1.45fr 1fr;gap:8px;align-items:start;font-size:var(--range-font,14px)}.catalog h3{font-size:1em;padding:8px}.catalog h3 span{display:block;font-size:.8em}.catalog .unit{padding:7px;font-size:1em}.common{background:#fff7e5}[hidden]{display:none!important}@media(max-width:650px){header{padding:12px}h1{font-size:1.2rem}.brand{max-width:140px}main{padding:12px}.views{gap:8px}.views button{padding:10px;font-size:1rem}.toolbar{align-items:flex-start;flex-wrap:wrap}.subjects{gap:8px}.column{gap:8px}.catalog{grid-template-columns:1fr 1fr;font-size:14px!important}.grades button{padding:8px 14px}}
</style></head><body><header><div class="heading"><div><h1 id="campus-name">生徒用 テスト範囲</h1><p id="exam-title"></p></div><span class="brand">実力判定テスト範囲確定APP<br>生徒専用</span></div></header>
<main><p id="status" role="status" aria-live="polite">読み込み中…</p><div id="app" hidden>
<nav class="views" aria-label="見る範囲"><button id="selected-view" aria-pressed="true">決まった範囲<small>自分の中学校のテスト範囲を確認</small></button><button id="catalog-view" aria-pressed="false">範囲表<small>単元を選ぶ前に、すべての候補を確認</small></button></nav>

</div></main><script src="config.js"></script><script src="cloud-api.js?v=20260924-rounds"></script><script src="current-exam.js"></script><script src="student.js?v=20260924-student"></script></body></html>
