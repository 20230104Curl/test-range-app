<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校舎一覧｜定期テスト模擬</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172641;font:16px/1.6 'Yu Gothic',Meiryo,sans-serif}header{background:#142b50;color:white;padding:22px 24px}header>div,main{max-width:1060px;margin:auto}h1{margin:0;font-size:1.6rem}main{padding:20px 24px}h2{font-size:1.1rem;margin:24px 0 10px}.hint{font-size:.875rem;color:#56657d}.search-box{position:sticky;top:0;background:#f3f6fb;padding:12px 0;z-index:1}label{display:block;font-weight:bold;margin-bottom:7px}.search-controls{display:flex;gap:8px}input,button{font:inherit}input{width:100%;min-width:0;border:1px solid #aab8cc;border-radius:9px;padding:12px;background:white}button,a{min-height:44px;border-radius:8px}button{border:1px solid #ccd6e5;background:white;color:#254573;padding:8px 14px;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #eaa329;outline-offset:3px}#clear{flex-shrink:0}.list{background:white;border:1px solid #d9e1ed;border-radius:12px;overflow:hidden}.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid #e5eaf2}.row:last-child{border:0}.star{font-size:1.5rem;padding:0;border:0;background:transparent}.star[aria-pressed=true]{color:#906200;background:#fff2c8}.name{font-weight:bold;overflow-wrap:anywhere}.actions{display:flex;gap:8px}.actions a{display:flex;align-items:center;text-decoration:none;padding:8px 14px;background:#eaf0fa;color:#214888;font-weight:700;font-size:.9375rem}.actions a:first-child{background:#1e4fc2;color:white}#count{margin:6px 0;color:#55647b;font-size:.875rem}#status{color:#80510a}.empty{padding:18px;background:white;border-radius:10px;color:#56657d}[hidden]{display:none!important}@media(max-width:620px){main{padding:16px 12px}.row{grid-template-columns:40px minmax(0,1fr);gap:6px 10px;padding:10px}.actions{grid-column:2}.actions a{padding:8px 12px}header{padding:18px 16px}}
.page-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}.app-name{font-size:1rem;font-weight:700;text-align:right}@media(max-width:620px){.app-name{font-size:.8rem}.page-heading{gap:12px}h1{white-space:nowrap}}</style></head><body><header><div class="page-heading"><h1>校舎一覧</h1><span class="app-name">実力判定テスト範囲確定APP</span></div></header><main><div class="search-box"><label for="search">校舎名で検索</label><div class="search-controls"><input id="search" type="search" placeholder="例：千種、塩付、ちくさ" autocomplete="off"><button id="clear" type="button">クリア</button></div><p id="count" role="status" aria-live="polite">読み込み中…</p></div><p class="hint">☆を押すとお気に入りとして上部に表示します。このブラウザに保存されます。</p><p id="status" role="status"></p><section id="favorites-section" hidden><h2>お気に入り</h2><div id="favorites" class="list"></div></section><section id="all-section"><h2 id="all-heading">校舎一覧（五十音順）</h2><div id="all" class="list"></div></section><p id="empty" class="empty" hidden>該当する校舎がありません。校舎名の一部で検索してください。</p></main><script src="campus-list.js?v=20260918-nav2"></script></body></html>
