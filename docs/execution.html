<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>実施用一覧</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172641;font:16px/1.5 'Yu Gothic',Meiryo,sans-serif}header{background:#142b50;color:white;padding:18px 24px}.header-inner,main{max-width:1160px;margin:auto}.header-inner{display:flex;justify-content:space-between;align-items:center;gap:20px}.exam-title{font-size:14px;color:#dce6f6}h1{font-size:24px;margin:4px 0 0}.header-right{text-align:right;flex-shrink:0}.brand-label{font-size:12px;font-weight:700;margin-bottom:10px}nav{display:flex;gap:8px;justify-content:flex-end}nav a{color:white;border:1px solid #7890b4;border-radius:8px;padding:9px 16px;text-decoration:none;font-weight:700}main{padding:22px 24px 36px}.controls{background:white;border:1px solid #d9e1ed;border-radius:12px;padding:16px 20px}.control-row{display:flex;align-items:center;gap:16px}.control-row+.control-row{margin-top:14px}.label{font-weight:700;color:#55647b;flex:0 0 40px}.buttons{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;font-weight:700;min-height:46px;padding:9px 22px;border:1px solid #b4c4dd;border-radius:8px;background:white;color:#172641;cursor:pointer}button[aria-pressed=true]{background:#1e4fc2;border-color:#1e4fc2;color:white}button:disabled{cursor:wait;opacity:.55}button:focus-visible,a:focus-visible{outline:3px solid #eaa329;outline-offset:3px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:20px 0 12px}h2{font-size:23px;margin:0}.count{color:#5a6b82;font-size:14px;margin-top:3px}#refresh{font-size:14px;padding:9px 16px}#status{margin:12px 0;color:#5a6b82;font-size:14px}#status.error{background:#fff3d7;color:#80510a;border-radius:8px;padding:12px}#common{background:#eaf0fa;color:#234786;border-radius:8px;padding:10px 14px;margin:0 0 12px}.table-wrap{background:white;border:1px solid #d9e1ed;border-radius:12px;overflow:hidden}table{border-collapse:collapse;width:100%;table-layout:fixed}thead{background:#eaf0fa;color:#4b607e}th,td{text-align:left;padding:13px 22px;border-bottom:1px solid #dfe6f0;vertical-align:middle}thead th:first-child{width:36%}tbody th{font-size:20px;font-weight:700;overflow-wrap:anywhere}tbody tr:last-child>*{border-bottom:0}.codes{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.code{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:48px;padding:0 12px;border-radius:8px;background:#eaf0fa;color:#1e4fc2;font-size:29px;line-height:1;font-weight:800}.alternate{font-size:18px;font-weight:700;border-radius:7px;background:#fff0d2;color:#80510a;padding:9px 14px}.alternate-text{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 0;font-size:18px}.pending{color:#77859b;font-size:18px}.invalid{color:#a44121;font-size:18px}#empty{padding:24px;text-align:center;color:#5a6b82}[hidden]{display:none!important}@media(max-width:720px){header{padding:14px 16px}.header-inner{align-items:flex-start;flex-direction:column;gap:12px}.header-right{width:100%}.brand-label{position:absolute;right:16px;top:12px;font-size:10px}.exam-title{padding-top:18px}nav{justify-content:flex-start}main{padding:16px}.controls{padding:14px}.control-row{align-items:flex-start;gap:10px}.control-row .label{padding-top:10px;flex-basis:32px}button{padding:9px 16px}.toolbar{align-items:flex-start}h2{font-size:20px}th,td{padding:12px}thead th:first-child{width:40%}tbody th{font-size:18px}.code{font-size:26px;min-width:44px;height:44px}.alternate-text{font-size:16px}}
</style>
</head>
<body>
<header><div class="header-inner"><div><div id="exam-title" class="exam-title"></div><h1 id="page-title">実施用一覧</h1></div><div class="header-right"><div class="brand-label">実力判定テスト範囲確定APP</div><nav aria-label="画面の切り替え"><a href="campuses.html">校舎一覧</a><a id="back" href="campuses.html">中学校別へ</a></nav></div></div></header>
<main>
<div class="controls"><div class="control-row"><span class="label">学年</span><div class="buttons" role="group" aria-label="学年"><button data-grade="1" aria-pressed="true">１年生</button><button data-grade="2" aria-pressed="false">２年生</button><button data-grade="3" aria-pressed="false">３年生</button></div></div><div class="control-row"><span class="label">教科</span><div id="subjects" class="buttons" role="group" aria-label="教科"></div></div></div>
<div class="toolbar"><div><h2 id="list-title">選択単元一覧</h2><div id="count" class="count"></div></div><button id="refresh" disabled>最新に更新</button></div>
<p id="status" role="status" aria-live="polite">読み込み中…</p><p id="common" hidden></p>
<div id="table-wrap" class="table-wrap" hidden><table aria-labelledby="list-title"><thead><tr><th scope="col">中学校</th><th scope="col">選択単元</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" hidden></p>
</main>
<script src="config.js"></script><script src="cloud-api.js"></script><script src="execution-data.js"></script><script src="execution.js"></script>
</body></html>
